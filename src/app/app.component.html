<div>
  <label>Select node (comma-separated indexes of path):</label>
  <input [(ngModel)]="pathComponentIndexes">
  <button (click)="select()">Select</button>
</div>

<ng-simple-tree
  #tree
  [options]="options"
  [data]="treeItems"
  [pathAttribute]="['name','id']"
  (itemSelected)="onSelectTreeItem($event)">
</ng-simple-tree>
